<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase on GitHub Pages</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: 0.5rem; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>Firebase + GitHub Pages</h1>
  <p>This page uses Firebase Firestore from client-side code on GitHub Pages.</p>

  <form id="note-form">
    <label>
      New note:
      <input id="note-input" type="text" placeholder="Write something" autocomplete="off" required>
    </label>
    <button type="submit">Save</button>
  </form>

  <h2>Saved notes</h2>
  <ul id="notes-list"></ul>
  <p id="status"></p>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'YOUR_API_KEY',
      authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
      projectId: 'YOUR_PROJECT_ID',
      storageBucket: 'YOUR_PROJECT_ID.appspot.com',
      messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
      appId: 'YOUR_APP_ID'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById('status');
    const notesList = document.getElementById('notes-list');
    const noteForm = document.getElementById('note-form');
    const noteInput = document.getElementById('note-input');

    async function setStatus(message) {
      statusEl.textContent = message;
    }

    async function loadNotes() {
      notesList.innerHTML = '';
      setStatus('Loading notes...');

      const notesQuery = query(collection(db, 'notes'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(notesQuery);

      if (snapshot.empty) {
        notesList.innerHTML = '<li>No notes yet.</li>';
      } else {
        snapshot.forEach(doc => {
          const note = doc.data();
          const li = document.createElement('li');
          li.textContent = note.text || 'Empty note';
          notesList.appendChild(li);
        });
      }

      setStatus('Loaded notes.');
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const text = noteInput.value.trim();
      if (!text) return;

      setStatus('Saving note...');
      await addDoc(collection(db, 'notes'), {
        text,
        createdAt: serverTimestamp()
      });

      noteInput.value = '';
      await loadNotes();
      setStatus('Saved.');
    });

    signInAnonymously(auth)
      .then(() => setStatus('Connected anonymously to Firebase.'))
      .catch(error => setStatus('Firebase auth error: ' + error.message));

    loadNotes().catch(error => setStatus('Error loading notes: ' + error.message));
  </script>
</body>
</html>
